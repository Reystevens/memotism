<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEMOTISM - Booking System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            black: '#09090b',
                            card: '#18181b',
                            green: '#22c55e',
                            greenHover: '#16a34a',
                            muted: '#27272a',
                            textMuted: '#71717a'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-black text-white font-sans antialiased min-h-screen pb-12">

    <header class="border-b border-zinc-800 py-4 px-4 mb-8 bg-zinc-950/50 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="logo.png" alt="MEMOTISM Logo" class="h-10 w-auto invert brightness-200">
            </div>
            <div class="text-right">
                <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-zinc-900 border border-zinc-800 text-xs text-zinc-300">
                    <span class="w-2 h-2 rounded-full bg-brand-green animate-pulse"></span> Live Booking
                </span>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4">
        
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 bg-brand-card p-4 rounded-xl border border-zinc-800">
            <div>
                <label class="block text-xs font-medium text-brand-textMuted mb-1">PILIH TANGGAL</label>
                <input type="date" id="bookingDate" onchange="fetchBookedSlots()" class="bg-zinc-900 border border-zinc-700 text-white text-sm rounded-lg p-2.5 focus:ring-brand-green focus:border-brand-green outline-none">
            </div>
            <div class="flex items-center gap-4 text-xs">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-zinc-900 border border-brand-green"></span>
                    <span class="text-zinc-300">Tersedia</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-brand-green"></span>
                    <span class="text-zinc-300">Dipilih</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-brand-muted"></span>
                    <span class="text-brand-textMuted">Booked</span>
                </div>
            </div>
        </div>

        <section>
            <h2 class="text-sm font-semibold tracking-wider text-brand-textMuted mb-3 uppercase">Pilih Sesi Jam (15 Menit)</h2>
            <div id="slotsGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-7 gap-2.5">
                </div>
        </section>

        <div id="actionBar" class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] max-w-xl bg-zinc-900/90 backdrop-blur-md border border-brand-green/30 p-4 rounded-2xl shadow-2xl flex items-center justify-between hidden z-30">
            <div>
                <p class="text-xs text-brand-textMuted">Sesi Terpilih:</p>
                <p id="selectedTimeText" class="text-lg font-bold text-brand-green">-</p>
            </div>
            <button onclick="openModal()" class="bg-brand-green hover:bg-brand-greenHover text-black font-semibold text-sm px-6 py-2.5 rounded-xl transition">
                Lanjut Pembayaran
            </button>
        </div>

    </main>

    <div id="checkoutModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-brand-card border border-zinc-800 rounded-2xl p-6 w-full max-w-md relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-brand-textMuted hover:text-white">✕</button>
            
            <h3 class="text-xl font-bold text-white mb-1">Konfirmasi Booking</h3>
            <p class="text-xs text-brand-textMuted mb-6">Isi data diri untuk mendapatkan QRIS DOKU</p>

            <form id="bookingForm" onsubmit="handleBookingSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-zinc-400 mb-1">Nama Lengkap</label>
                    <input type="text" id="custName" required placeholder="John Doe" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-3 text-sm text-white focus:border-brand-green outline-none">
                </div>
                <div>
                    <label class="block text-xs text-zinc-400 mb-1">Nomor WhatsApp</label>
                    <input type="tel" id="custPhone" required placeholder="08123456789" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-3 text-sm text-white focus:border-brand-green outline-none">
                </div>

                <div class="border-t border-b border-zinc-800 py-3 my-2 space-y-1">
                    <div class="flex justify-between text-xs text-zinc-400">
                        <span>Durasi Sesi</span>
                        <span>15 Menit</span>
                    </div>
                    <div class="flex justify-between text-sm font-semibold text-white">
                        <span>Total Bayar</span>
                        <span class="text-brand-green">Rp 1.000</span>
                    </div>
                </div>

                <button type="submit" id="payBtn" class="w-full bg-brand-green hover:bg-brand-greenHover text-black font-bold py-3 rounded-xl transition text-sm">
                    Bayar via QRIS (DOKU)
                </button>
            </form>

            <div id="qrisContainer" class="hidden text-center py-4">
                <p class="text-xs text-zinc-400 mb-4">Scan QRIS di bawah ini untuk menyelesaikan pembayaran:</p>
                <div class="bg-white p-4 rounded-xl inline-block mb-4 shadow-lg">
                    <img id="qrisImage" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=DOKU_QRIS_MEMOTISM" alt="QRIS DOKU" class="w-44 h-44">
                </div>
                <p class="text-xs text-brand-green animate-pulse">Menunggu konfirmasi pembayaran otomatis DOKU...</p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://yofdfbqogzenvzwyqwcq.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_5t-m112GtGpHw7rWMZm1-Q_56iBpT--';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // UBAH HARGA FIX DI SINI (Dalam rupiah)
        const FIX_PRICE = 1000; 

        let selectedSlot = null;
        let bookedSlots = [];

        document.getElementById('bookingDate').valueAsDate = new Date();

        async function fetchBookedSlots() {
            const selectedDate = document.getElementById('bookingDate').value;
            
            const { data, error } = await supabaseClient
                .from('bookings')
                .select('time_slot')
                .eq('booking_date', selectedDate);

            if (error) {
                console.error('Error fetching slots:', error);
                bookedSlots = [];
            } else {
                bookedSlots = data.map(item => item.time_slot);
            }

            selectedSlot = null;
            document.getElementById('actionBar').classList.add('hidden');
            generateSlots();
        }

        function generateSlots() {
            const grid = document.getElementById('slotsGrid');
            grid.innerHTML = '';

            let endMinutes = 22 * 60;

                let hours = Math.floor(time / 60).toString().padStart(2, '0');
                let mins = (time % 60).toString().padStart(2, '0');
                let timeString = `${hours}:${mins}`;

                let isBooked = bookedSlots.includes(timeString);

                let btn = document.createElement('button');
                btn.type =
